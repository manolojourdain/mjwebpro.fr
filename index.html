<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJ WEB PRO</title>
    
    <!-- Importation de la typographie premium Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            /* SEULE MODIFICATION : Application globale de Manrope sur tous vos éléments textes (Titre, Sous-titre, CTA) */
            font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040404; /* Noir très profond mais pas 100% plat */
            cursor: default;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            /* Prêt pour l'intégration future : n'intercepte pas les clics du futur contenu */
            pointer-events: none; 
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(
                circle at 50% 50%, 
                rgba(4, 4, 4, 0) 30%, 
                rgba(3, 3, 3, 0.4) 70%, 
                rgba(2, 2, 2, 0.85) 100%
            );
        }

        /* NOUVEAU CONTENU HTML */
        .content-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: none; /* Laisse passer les mouvements de souris pour la 3D */
            width: 100%;
            padding: 0 20px;
        }

        .content-wrapper h1 {
            font-weight: 800;
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: #fcfcfc;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .content-wrapper p {
            font-weight: 300;
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 2.5rem;
            letter-spacing: 0.01em;
        }

        .content-wrapper button {
            pointer-events: auto; /* Réactive le clic spécifiquement sur le bouton */
            font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            color: #ffffff;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 36px;
            border-radius: 40px;
            cursor: pointer;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            letter-spacing: 0.02em;
        }

        .content-wrapper button:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* NOUVEAU : Canvas dédié à l'animation du trait de souris */
        #cursor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Laisse passer toutes les interactions */
            z-index: 4; /* Modifié pour être au-dessus de la 3D, de la vignette ET du contenu HTML */
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div class="vignette"></div>
    
    <!-- CONTENU HTML CENTRAL -->
    <div class="content-wrapper">
        <h1>MJ WEB PRO</h1>
        <p>Tout votre digital au même endroit</p>
    <button onclick="window.open('https://wa.me/33632086837?text=Bonjour%2C%20je%20souhaite%20démarrer%20un%20projet%20avec%20MJ%20Web%20Pro.', '_blank')">
    Démarrer un projet
</button>
    </div>

    <!-- NOUVEAU : Le canvas transparent pour la traînée -->
    <canvas id="cursor-canvas"></canvas>

    <script>
        const canvas = document.getElementById('webgl-canvas');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // =========================================================
        // SECTION 3D EXISTANTE (STRICTEMENT INCHANGÉE)
        // =========================================================

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040404);
        
        scene.fog = new THREE.FogExp2(0x040404, 0.006);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: false,
            powerPreference: "high-performance"
        });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        function getDensity(x, y, z) {
            let n = Math.sin(x * 0.04) + Math.cos(y * 0.04) + Math.sin(z * 0.03);
            n += Math.sin(x * 0.08 + y * 0.05) * 0.5;
            n += Math.cos(z * 0.06 - x * 0.04) * 0.5;
            return n;
        }

        const particleCount = 18000;
        const positions = [];
        const sizes = [];
        const opacities = [];

        const bounds = {
            x: 120,
            y: 80,
            z: 200 
        };

        let generated = 0;
        let attempts = 0;

        while (generated < particleCount && attempts < particleCount * 10) {
            attempts++;
            
            const px = (Math.random() - 0.5) * bounds.x;
            const py = (Math.random() - 0.5) * bounds.y;
            const pz = (Math.random() * -bounds.z) + 10;

            const density = getDensity(px, py, pz);

            if (density > 0.8 || Math.random() < 0.02) {
                positions.push(px, py, pz);
                
                const isSlightlyBigger = Math.random() > 0.95;
                sizes.push(isSlightlyBigger ? (Math.random() * 2.5 + 1.5) : (Math.random() * 1.0 + 0.3));
                
                const baseOpacity = isSlightlyBigger ? (Math.random() * 0.4 + 0.3) : (Math.random() * 0.2 + 0.05);
                opacities.push(baseOpacity);
                
                generated++;
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
        geometry.setAttribute('aOpacity', new THREE.Float32BufferAttribute(opacities, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: renderer.getPixelRatio() },
                uColor: { value: new THREE.Color(0xd0d4d8) } 
            },
            vertexShader: `
                uniform float uTime;
                uniform float uPixelRatio;
                
                attribute float aSize;
                attribute float aOpacity;
                
                varying float vOpacity;
                
                void main() {
                    vec3 pos = position;
                    
                    pos.x += sin(uTime * 0.15 + pos.z * 0.05) * 1.5;
                    pos.y += cos(uTime * 0.12 + pos.x * 0.05) * 1.5;
                    
                    float depth = 200.0;
                    float speed = 1.2;
                    float zOffset = mod(pos.z + uTime * speed + depth, depth) - depth + 10.0;
                    pos.z = zOffset;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    
                    gl_PointSize = aSize * uPixelRatio * (250.0 / -mvPosition.z);
                    
                    float fadeNear = smoothstep(0.0, -15.0, mvPosition.z);
                    float fadeFar = smoothstep(-190.0, -140.0, mvPosition.z);
                    
                    vOpacity = aOpacity * fadeNear * fadeFar;
                    
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vOpacity;
                
                void main() {
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float dist = length(coord);
                    
                    if (dist > 0.5) discard;
                    
                    float circleAlpha = smoothstep(0.5, 0.1, dist);
                    
                    gl_FragColor = vec4(uColor, vOpacity * circleAlpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        let targetCameraX = 0;
        let targetCameraY = 0;
        let currentCameraX = 0;
        let currentCameraY = 0;

        document.addEventListener('mousemove', (e) => {
            if (prefersReducedMotion) return;
            
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            targetCameraX = x * 3.5;
            targetCameraY = y * 2.5;
        });

        // =========================================================
        // NOUVEAU : SYSTÈME DE CURSEUR INDÉPENDANT 
        // =========================================================

        const cursorCanvas = document.getElementById('cursor-canvas');
        const ctx = cursorCanvas.getContext('2d');
        
        let cursorHistory = [];
        const MAX_POINTS = 16;
        const LERP_FACTOR = 0.35;
        
        let mouseCursor = { x: 0, y: 0 };
        let headCursor = { x: 0, y: 0 };
        let isCursorActive = false;
        let hasMoved = false;
        const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        function resizeCanvases() {
            // Resize Three.js
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            material.uniforms.uPixelRatio.value = renderer.getPixelRatio();

            // Resize Cursor Canvas (Retina)
            const dpr = Math.min(window.devicePixelRatio, 2);
            cursorCanvas.width = window.innerWidth * dpr;
            cursorCanvas.height = window.innerHeight * dpr;
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvases);
        // Exécution initiale pour caler le scale 2D
        resizeCanvases();

        // Écouteur dédié à la traînée (complète proprement l'existant)
        document.addEventListener('mousemove', (e) => {
            if (prefersReducedMotion || isTouch) return;
            
            mouseCursor.x = e.clientX;
            mouseCursor.y = e.clientY;
            
            // Si c'est le tout premier mouvement, le point de départ est calé sur la souris
            if (!hasMoved) {
                headCursor.x = e.clientX;
                headCursor.y = e.clientY;
                hasMoved = true;
                isCursorActive = true;
            } 
            // Si la souris revient dans la fenêtre, on recrée la ligne proprement
            else if (!isCursorActive) {
                headCursor.x = e.clientX;
                headCursor.y = e.clientY;
                cursorHistory = [];
                isCursorActive = true;
            }
        });

        document.addEventListener('mouseleave', () => {
            isCursorActive = false; // Force la disparition propre
        });
        
        document.addEventListener('mouseenter', (e) => {
            if (prefersReducedMotion || isTouch) return;
            mouseCursor.x = e.clientX;
            mouseCursor.y = e.clientY;
            headCursor.x = e.clientX;
            headCursor.y = e.clientY;
            cursorHistory = [];
            isCursorActive = true;
        });

        function drawCursorTrail() {
            if (prefersReducedMotion || isTouch) return;
            
            // Effacement total à chaque frame
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            
            if (!hasMoved) return;
            if (!isCursorActive && cursorHistory.length === 0) return;

            // Inertie de la "tête" de la traînée
            headCursor.x += (mouseCursor.x - headCursor.x) * LERP_FACTOR;
            headCursor.y += (mouseCursor.y - headCursor.y) * LERP_FACTOR;

            const dist = Math.hypot(mouseCursor.x - headCursor.x, mouseCursor.y - headCursor.y);
            
            // Ajout du point si on bouge (ou si on vient de s'arrêter pour résorber la ligne)
            if (isCursorActive || dist > 0.1) {
                cursorHistory.push({ x: headCursor.x, y: headCursor.y });
                if (cursorHistory.length > MAX_POINTS) {
                    cursorHistory.shift();
                }
            } else if (cursorHistory.length > 0) {
                // Raccourcit rapidement la queue si on a quitté la fenêtre
                cursorHistory.shift(); 
            }

            if (cursorHistory.length < 3) return;

            // Empêche le rendu d'un petit point figé quand la souris est totalement immobile
            let totalDist = 0;
            for (let i = 1; i < cursorHistory.length; i++) {
                totalDist += Math.hypot(cursorHistory[i].x - cursorHistory[i-1].x, cursorHistory[i].y - cursorHistory[i-1].y);
            }
            if (totalDist < 1) return;

            // Dessin de la courbe ultra-fluide avec variation d'opacité et d'épaisseur
            for (let i = 1; i < cursorHistory.length - 1; i++) {
                const p0 = cursorHistory[i - 1];
                const p1 = cursorHistory[i];
                const p2 = cursorHistory[i + 1];

                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                const prevMidX = (p0.x + p1.x) / 2;
                const prevMidY = (p0.y + p1.y) / 2;

                // Index bas = fin de la queue | Index haut = tête près du curseur
                const progress = i / cursorHistory.length; 
                const alpha = Math.pow(progress, 1.2) * 0.85;
                const thickness = 0.2 + progress * (1.8 - 0.2);

                ctx.beginPath();
                ctx.moveTo(prevMidX, prevMidY);
                ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
                
                ctx.strokeStyle = `rgba(240, 240, 240, ${alpha})`;
                ctx.lineWidth = thickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }

        // =========================================================
        // BOUCLE D'ANIMATION UNIFIÉE
        // =========================================================

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const motionFactor = prefersReducedMotion ? 0.1 : 1.0;

            // 1. Mise à jour de l'expérience 3D
            material.uniforms.uTime.value = elapsedTime * motionFactor;

            const lerpSpeed = 0.015;
            currentCameraX += (targetCameraX - currentCameraX) * lerpSpeed;
            currentCameraY += (targetCameraY - currentCameraY) * lerpSpeed;

            camera.position.x = currentCameraX;
            camera.position.y = currentCameraY;
            camera.lookAt(currentCameraX * 0.5, currentCameraY * 0.5, -50);

            renderer.render(scene, camera);

            // 2. Mise à jour du canvas de curseur superposé
            drawCursorTrail();
        }

        // Start
        window.onload = () => animate();
    </script>
</body>
</html>
